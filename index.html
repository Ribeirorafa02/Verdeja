<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#063f2d">
<title>VerdeJá</title>
<style>
:root{--g:#063f2d;--g2:#0b6044;--gold:#e5c353;--bg:#f4f6f0;--ink:#10251d;--mut:#697770;--line:#dfe6df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:18px 16px;position:sticky;top:0;z-index:20}.head{max-width:1100px;margin:auto;display:flex;gap:10px;align-items:center}.logo{font-size:28px;font-weight:900;margin-right:auto}.logo span{color:var(--gold)}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:900}.gold{background:var(--gold);color:var(--ink)}.dark{background:var(--g);color:white}.ghost{background:#ffffff16;color:white;border:1px solid #ffffff30}.light{background:#edf2ed;color:var(--g)}
.search{max-width:1100px;margin:14px auto 0}.search input{width:100%;border:0;border-radius:15px;padding:15px 17px;font-size:17px}.nav{max-width:1100px;margin:12px auto 0;display:flex;gap:8px;overflow:auto}.nav button{white-space:nowrap;background:#ffffff12;color:white;border:0;border-radius:12px;padding:11px 14px;font-weight:800}.nav button.on{background:var(--gold);color:var(--ink)}
main{max-width:1100px;margin:auto;padding:24px 16px 70px}.hero{background:linear-gradient(135deg,var(--g),#126b4c);color:white;padding:35px 26px;border-radius:28px;margin-bottom:26px}.hero h1{font-size:38px;max-width:700px;line-height:1.08;margin:0 0 12px}.hero p{font-size:19px;opacity:.9}.page{display:none}.page.on{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.card,.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:19px;box-shadow:0 6px 22px #0a39260c}.emoji{font-size:45px}.price{font-size:22px;font-weight:900;margin:9px 0}.muted{color:var(--mut)}h2{margin-top:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}.field label{font-weight:800}.field input,.field select,.field textarea{padding:13px;border:1px solid #ccd6ce;border-radius:12px;background:white}.rolegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.role{background:white;border:2px solid var(--line);border-radius:17px;padding:15px;text-align:left}.role.sel{border-color:var(--gold);background:#fff9df}.notice{padding:13px 15px;border-radius:13px;background:#eef7f1;margin:12px 0}.ok{background:#e7f7e8}.bad{background:#fff0ed}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#edf3ee;font-weight:800;font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}.hidden{display:none!important}.empty{text-align:center;padding:30px;color:var(--mut)}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.on{display:flex}.sheet{background:white;width:min(700px,100%);max-height:92vh;overflow:auto;border-radius:25px 25px 0 0;padding:22px}.close{float:right;border:0;background:#edf1ed;border-radius:50%;width:38px;height:38px;font-size:20px}
@media(max-width:700px){.form{grid-template-columns:1fr}.full{grid-column:auto}.rolegrid{grid-template-columns:1fr}.hero h1{font-size:31px}.head .btn{padding:10px 12px}.logo{font-size:24px}}
</style>
</head>
<body>
<header>
 <div class="head"><div class="logo">🥬 Verde<span>Já</span></div><button class="btn ghost" onclick="openLogin()">Entrar</button><button class="btn gold" onclick="openRegister()">Cadastrar</button></div>
 <div class="search"><input id="q" placeholder="Buscar verduras, cestas..." oninput="loadProducts()"></div>
 <div class="nav">
  <button id="nHome" onclick="page('home')">🛒 Comprar</button><button onclick="page('orders')">📦 Pedidos</button><button onclick="page('seller')">🌱 Vendedor</button><button onclick="page('courier')">🏍️ Entregador</button><button onclick="page('admin')">⚙️ Administração</button>
 </div>
</header>
<main>
<section id="home" class="page on"><div class="hero"><h1>Verduras fresquinhas, direto para você.</h1><p>Marketplace de produtores locais com entrega em casa.</p><button class="btn gold" onclick="document.getElementById('products').scrollIntoView()">Comprar agora</button></div><div class="row"><h2>Produtos disponíveis</h2><span class="tag right">Marketplace</span></div><div id="products" class="grid"></div></section>

<section id="orders" class="page"><div class="panel"><div class="row"><h2>Meu carrinho</h2><span id="cartSum" class="tag right"></span></div><div id="cart"></div><div id="checkoutBox" class="hidden"><hr><h3>Finalizar pedido</h3><div class="form"><div class="field"><label>Endereço *</label><input id="address"></div><div class="field"><label>Pagamento</label><select id="payment"><option>Pix</option><option>Cartão</option><option>Dinheiro na entrega</option></select></div></div><br><button class="btn gold" onclick="checkout()">Confirmar pedido</button></div></div><div class="panel"><h3>Histórico de pedidos</h3><div id="history"></div></div></section>

<section id="seller" class="page"><div id="sellerPanel"></div></section>
<section id="courier" class="page"><div id="courierPanel"></div></section>
<section id="admin" class="page"><div id="adminPanel"></div></section>
</main>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<footer style="background:#063f2d;color:#fff;text-align:center;padding:28px">VerdeJá • Marketplace de verduras</footer>

<script>
let token=localStorage.getItem("vj_token")||"", me=JSON.parse(localStorage.getItem("vj_user")||"null"), products=[], cart=JSON.parse(localStorage.getItem("vj_cart")||"[]");
const $=id=>document.getElementById(id);
async function api(url,opt={}){opt.headers=Object.assign({"Content-Type":"application/json"},opt.headers||{},token?{"Authorization":"Bearer "+token}:{});const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Erro");return d}
function saveCart(){localStorage.setItem("vj_cart",JSON.stringify(cart))}
function money(n){return "R$ "+Number(n).toFixed(2).replace(".",",")}
function page(id){document.querySelectorAll(".page").forEach(x=>x.classList.remove("on"));$(id).classList.add("on");if(id==="home")loadProducts();if(id==="orders")loadOrders();if(id==="seller")loadSeller();if(id==="courier")loadCourier();if(id==="admin")loadAdmin();scrollTo(0,0)}
function modal(html){$("modalBody").innerHTML=html;$("modal").classList.add("on")}
function closeModal(){$("modal").classList.remove("on")}
function openLogin(){modal(`<h2>Entrar</h2><form class="form" onsubmit="login(event)"><div class="field full"><label>E-mail</label><input id="le" type="email" required></div><div class="field full"><label>Senha</label><input id="lp" type="password" required></div><div class="field full"><button class="btn gold">Entrar</button></div></form><div id="msg"></div>`)}
function openRegister(){modal(`<h2>Criar conta</h2><p class="muted">Escolha seu perfil.</p><div class="rolegrid"><button id="rc" class="role sel" onclick="regRole('customer')">👤 <b>Cliente</b><br><small>Comprar</small></button><button id="rs" class="role" onclick="regRole('seller')">🌱 <b>Vendedor</b><br><small>Vender</small></button><button id="rr" class="role" onclick="regRole('courier')">🏍️ <b>Entregador</b><br><small>Entregar</small></button></div><form class="form" id="rf" data-role="customer" onsubmit="register(event)"><div class="field"><label>Nome *</label><input id="rn" required></div><div class="field"><label>WhatsApp *</label><input id="rp" required></div><div class="field"><label>E-mail *</label><input id="re" type="email" required></div><div class="field"><label>Senha *</label><input id="rpass" type="password" minlength="6" required></div><div id="storeF" class="field full hidden"><label>Nome da horta/loja *</label><input id="store"></div><div id="vehicleF" class="field full hidden"><label>Veículo *</label><select id="vehicle"><option value="">Selecione</option><option>Moto</option><option>Carro</option><option>Bicicleta</option></select></div><div class="field full"><label>Endereço</label><input id="ra"></div><div class="field full"><button class="btn gold">Criar minha conta</button></div></form><div id="msg"></div>`)}
function regRole(r){$("rf").dataset.role=r;["rc","rs","rr"].forEach(x=>$(x).classList.remove("sel"));$(r==="customer"?"rc":r==="seller"?"rs":"rr").classList.add("sel");$("storeF").classList.toggle("hidden",r!=="seller");$("vehicleF").classList.toggle("hidden",r!=="courier")}
async function register(e){e.preventDefault();const role=$("rf").dataset.role;try{const d=await api("/api/register",{method:"POST",body:JSON.stringify({role,name:$("rn").value,phone:$("rp").value,email:$("re").value,password:$("rpass").value,address:$("ra").value,store:$("store")?.value,vehicle:$("vehicle")?.value})});token=d.token;me=d.user;localStorage.setItem("vj_token",token);localStorage.setItem("vj_user",JSON.stringify(me));$("msg").innerHTML=`<div class="notice ok"><b>Cadastro realizado!</b><br>${me.role==="customer"?"Você já pode comprar.":"Seu cadastro está pendente de aprovação."}</div>`;setTimeout(()=>{closeModal();page(me.role==="seller"?"seller":me.role==="courier"?"courier":"home")},700)}catch(e){$("msg").innerHTML=`<div class="notice bad">${e.message}</div>`}}
async function login(e){e.preventDefault();try{const d=await api("/api/login",{method:"POST",body:JSON.stringify({email:$("le").value,password:$("lp").value})});token=d.token;me=d.user;localStorage.setItem("vj_token",token);localStorage.setItem("vj_user",JSON.stringify(me));closeModal();page(me.role==="seller"?"seller":me.role==="courier"?"courier":me.role==="admin"?"admin":"home")}catch(e){$("msg").innerHTML=`<div class="notice bad">${e.message}</div>`}}
function logout(){token="";me=null;localStorage.removeItem("vj_token");localStorage.removeItem("vj_user");page("home");alert("Você saiu da conta")}
async function loadProducts(){try{products=(await api("/api/products?q="+encodeURIComponent($("q").value))).products;$("products").innerHTML=products.length?products.map(p=>`<div class="card"><div class="emoji">🥬</div><h3>${p.name}</h3><p class="muted">${p.description||""}</p><span class="tag">${p.unit}</span><div class="price">${money(p.price)}</div><button class="btn gold" onclick="add('${p.id}')">Adicionar ao carrinho</button></div>`).join(""):'<div class="empty">Nenhum produto encontrado.</div>'}catch(e){}}
function add(id){const x=cart.find(i=>i.productId===id);if(x)x.qty++;else cart.push({productId:id,qty:1});saveCart();page("orders")}
function change(i,d){cart[i].qty+=d;if(cart[i].qty<1)cart.splice(i,1);saveCart();renderCart()}
async function renderCart(){const full=[];for(const c of cart){const p=products.find(x=>x.id===c.productId)||((await api("/api/products")).products.find(x=>x.id===c.productId));if(p)full.push({...c,p})}let total=full.reduce((s,x)=>s+x.p.price*x.qty,0);$("cartSum").textContent=money(total);$("cart").innerHTML=full.length?full.map((x,i)=>`<div class="row" style="padding:12px 0;border-bottom:1px solid #e2e7e2"><b>${x.p.name}</b><span class="right">${money(x.p.price*x.qty)}</span><button class="btn light" onclick="change(${i},-1)">−</button><b>${x.qty}</b><button class="btn light" onclick="change(${i},1)">+</button></div>`).join(""):'<div class="empty">Carrinho vazio.</div>';$("checkoutBox").classList.toggle("hidden",!full.length)}
async function checkout(){if(!me){openLogin();return}try{const d=await api("/api/orders",{method:"POST",body:JSON.stringify({items:cart,address:$("address").value,payment:$("payment").value})});cart=[];saveCart();alert("Pedido #"+d.order.id+" confirmado!");await renderCart();loadOrders()}catch(e){alert(e.message)}}
async function loadOrders(){if(!me){$("cart").innerHTML='<div class="notice">Entre ou cadastre-se para finalizar pedidos.</div>';$("history").innerHTML='<div class="empty">Faça login para ver seus pedidos.</div>';await renderCart();return}try{const d=await api("/api/orders");$("history").innerHTML=d.orders.length?d.orders.map(o=>`<div class="notice"><b>#${o.id}</b> • ${status(o.status)}<br>${o.items.map(i=>i.name+" × "+i.qty).join(", ")}<br><b>${money(o.total)}</b> • ${o.payment}</div>`).join(""):'<div class="empty">Nenhum pedido.</div>';await renderCart()}catch(e){$("history").innerHTML=e.message}}
function status(s){return ({new:"Novo",preparing:"Preparando",ready:"Pronto",in_delivery:"Em entrega",delivered:"Entregue",cancelled:"Cancelado"})[s]||s}
async function loadSeller(){if(!me||me.role!=="seller"){$("sellerPanel").innerHTML='<div class="panel"><h2>Área do vendedor</h2><p>Entre ou cadastre-se como vendedor.</p><button class="btn gold" onclick="openRegister()">Quero vender</button></div>';return}try{const d=await api("/api/seller/products");const od=await api("/api/orders");$("sellerPanel").innerHTML=`<div class="panel"><div class="row"><h2>Minha loja</h2><button class="btn light right" onclick="logout()">Sair</button></div><p>${me.store||me.name} • <span class="tag">${me.status}</span></p></div><div class="panel"><h3>Novo produto</h3><form class="form" onsubmit="newProduct(event)"><div class="field"><label>Nome *</label><input id="pn" required></div><div class="field"><label>Preço *</label><input id="pp" type="number" step=".01" min=".01" required></div><div class="field"><label>Unidade</label><select id="pu"><option>unidade</option><option>kg</option><option>maço</option><option>cesta</option></select></div><div class="field"><label>Estoque</label><input id="ps" type="number" min="0" value="10"></div><div class="field full"><label>Descrição</label><input id="pd"></div><div class="field full"><button class="btn gold">Publicar produto</button></div></form></div><div class="panel"><h3>Produtos</h3>${d.products.map(p=>`<div class="notice"><b>${p.name}</b> • ${money(p.price)}/${p.unit} • estoque ${p.stock} <button class="btn light right" onclick="stock('${p.id}')">Alterar estoque</button></div>`).join("")||'<div class="empty">Nenhum produto.</div>'}</div><div class="panel"><h3>Pedidos da loja</h3>${od.orders.map(o=>`<div class="notice"><b>#${o.id}</b> • ${status(o.status)} • ${money(o.total)}<br>${o.items.map(i=>i.name+" × "+i.qty).join(", ")}<br>${o.status==="new"?`<button class="btn gold" onclick="orderStatus('${o.id}','preparing')">Preparar</button>`:""} ${o.status==="preparing"?`<button class="btn gold" onclick="orderStatus('${o.id}','ready')">Marcar pronto</button>`:""}</div>`).join("")||'<div class="empty">Nenhum pedido.</div>'}</div>`}catch(e){$("sellerPanel").innerHTML='<div class="panel">'+e.message+'</div>'}}
async function newProduct(e){e.preventDefault();try{await api("/api/products",{method:"POST",body:JSON.stringify({name:$("pn").value,price:$("pp").value,unit:$("pu").value,stock:$("ps").value,description:$("pd").value})});alert("Produto publicado");loadSeller()}catch(e){alert(e.message)}}
async function stock(id){const n=prompt("Novo estoque:");if(n!==null)try{await api("/api/products/"+id,{method:"PATCH",body:JSON.stringify({stock:Number(n)})});loadSeller()}catch(e){alert(e.message)}}
async function orderStatus(id,s){try{await api("/api/orders/"+id+"/status",{method:"PATCH",body:JSON.stringify({status:s})});loadSeller()}catch(e){alert(e.message)}}
async function loadCourier(){if(!me||me.role!=="courier"){$("courierPanel").innerHTML='<div class="panel"><h2>Área do entregador</h2><p>Entre ou cadastre-se como entregador.</p><button class="btn gold" onclick="openRegister()">Quero ser entregador</button></div>';return}try{const d=await api("/api/orders");$("courierPanel").innerHTML=`<div class="panel"><div class="row"><h2>Entregas</h2><button class="btn light right" onclick="logout()">Sair</button></div><p>${me.name} • ${me.vehicle} • <span class="tag">${me.status}</span></p></div><div class="panel"><h3>Pedidos disponíveis</h3>${d.orders.filter(o=>!o.courierId&&["new","preparing","ready"].includes(o.status)).map(o=>`<div class="notice"><b>#${o.id}</b> • ${o.address}<br>${money(o.total)}<br><button class="btn gold" onclick="accept('${o.id}')">Aceitar entrega</button></div>`).join("")||'<div class="empty">Nenhuma entrega disponível.</div>'}</div><div class="panel"><h3>Minhas entregas</h3>${d.orders.filter(o=>o.courierId===me.id).map(o=>`<div class="notice"><b>#${o.id}</b> • ${status(o.status)}<br>${o.address}<br>${o.status==="in_delivery"?`<button class="btn gold" onclick="orderStatusCourier('${o.id}')">Marcar entregue</button>`:""}</div>`).join("")||'<div class="empty">Você ainda não aceitou entregas.</div>'}</div>`}catch(e){$("courierPanel").innerHTML='<div class="panel">'+e.message+'</div>'}}
async function accept(id){try{await api("/api/orders/"+id+"/accept",{method:"POST"});alert("Entrega aceita");loadCourier()}catch(e){alert(e.message)}}
async function orderStatusCourier(id){try{await api("/api/orders/"+id+"/status",{method:"PATCH",body:JSON.stringify({status:"delivered"})});loadCourier()}catch(e){alert(e.message)}}
async function loadAdmin(){if(!me||me.role!=="admin"){$("adminPanel").innerHTML='<div class="panel"><h2>Administração</h2><p>Acesso restrito ao administrador.</p><button class="btn dark" onclick="openLogin()">Entrar como administrador</button></div>';return}try{const s=await api("/api/admin/summary"),u=await api("/api/admin/users");$("adminPanel").innerHTML=`<div class="panel"><div class="row"><h2>Dashboard</h2><button class="btn light right" onclick="logout()">Sair</button></div><div class="grid"><div class="card"><b>Usuários</b><h2>${s.users}</h2></div><div class="card"><b>Produtos</b><h2>${s.products}</h2></div><div class="card"><b>Pedidos</b><h2>${s.orders}</h2></div><div class="card"><b>Vendas</b><h2>${money(s.sales)}</h2></div><div class="card"><b>Sua comissão</b><h2>${money(s.commission)}</h2></div></div></div><div class="panel"><h3>Comissão da plataforma</h3><div class="row"><input id="comm" type="number" min="0" max="100" step=".1" value="${s.rate}" style="padding:12px;border:1px solid #ccd6ce;border-radius:10px;width:150px"><span>%</span><button class="btn gold" onclick="saveComm()">Salvar</button></div></div><div class="panel"><h3>Usuários e aprovações</h3><table><tr><th>Nome</th><th>Tipo</th><th>Status</th><th>Ação</th></tr>${u.users.filter(x=>x.role!=="admin").map(x=>`<tr><td>${x.name}<br><small>${x.email}</small></td><td>${x.role}</td><td>${x.status}</td><td>${x.status==="pending"?`<button class="btn gold" onclick="userStatus('${x.id}','approved')">Aprovar</button>`:`<button class="btn light" onclick="userStatus('${x.id}','blocked')">Bloquear</button>`}</td></tr>`).join("")}</table></div>`}catch(e){$("adminPanel").innerHTML='<div class="panel">'+e.message+'</div>'}}
async function saveComm(){try{await api("/api/admin/settings",{method:"PATCH",body:JSON.stringify({commission:$("comm").value})});alert("Comissão salva");loadAdmin()}catch(e){alert(e.message)}}
async function userStatus(id,s){try{await api("/api/admin/users/"+id+"/status",{method:"PATCH",body:JSON.stringify({status:s})});loadAdmin()}catch(e){alert(e.message)}}
loadProducts();renderCart();
</script>
</body></html>
